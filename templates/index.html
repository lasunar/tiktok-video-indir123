<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video İndirici</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); width: 100%; max-width: 500px; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 10px; background: linear-gradient(45deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        input[type="text"] { width: 100%; padding: 15px; border: 2px solid #333; border-radius: 8px; background: #252525; color: #fff; font-size: 16px; outline: none; margin-bottom: 20px; }
        input[type="text"]:focus { border-color: #00f2fe; }
        
        .main-btn { width: 100%; padding: 15px; background: linear-gradient(45deg, #ff007f, #7f00ff); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; min-height: 50px; transition: 0.2s; }
        .main-btn:active { transform: scale(0.98); }
        
        .loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #ff007f; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #result { margin-top: 25px; display: none; }
        #videoTitle { color: #eee; font-size: 14px; margin-bottom: 10px; font-style: italic; }
        video { border-radius: 8px; margin-top: 10px; border: 2px solid #333; background: #000; }
        
        .green-btn { background: #00ea96; color: #000; display: block; width: 100%; padding: 18px; border-radius: 8px; font-weight: bold; margin-top: 15px; font-size: 16px; border: none; cursor: pointer; transition: 0.2s; }
        .green-btn:active { transform: scale(0.96); }
        .status-text { font-size: 13px; color: #ff007f; margin-top: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>TikTok Video İndir</h1>
    <p>Video linkini yapıştırın ve indirin (Logosuz)</p>
    
    <input type="text" id="videoLink" placeholder="https://www.tiktok.com/@..." autocomplete="off">
    <button class="main-btn" onclick="processVideo()">Videoyu Hazırla</button>
    
    <div class="loader" id="loading"></div>

    <div id="result">
        <div style="color: #00ea96; font-weight: bold; margin-bottom: 10px;">🎯 Video Hazır!</div>
        <div id="videoTitle"></div>
        
        <video id="videoPlayer" width="100%" controls playsinline preload="metadata"></video>
        
        <button id="greenDownloadBtn" class="green-btn" onclick="downloadToGallery()">📥 Doğrudan Galeriye İndir</button>
        <div id="statusText" class="status-text">Galeri formatına dönüştürülüyor, lütfen bekleyin...</div>
    </div>
</div>

<script>
    let globalDownloadUrl = "";

    async function processVideo() {
        const link = document.getElementById('videoLink').value;
        const loader = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoTitle = document.getElementById('videoTitle');

        if (!link) {
            alert('Lütfen bir TikTok linki yapıştırın!');
            return;
        }

        loader.style.display = 'block';
        resultDiv.style.display = 'none';

        try {
            const response = await fetch('/fetch-video', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: link })
            });
            
            const data = await response.json();
            loader.style.display = 'none';

            if (data.success) {
                resultDiv.style.display = 'block';
                videoTitle.innerText = data.title;
                videoPlayer.src = data.download_url;
                videoPlayer.load();
                
                // Flask proxy linkini buton için hazırlıyoruz
                globalDownloadUrl = `/proxy-download?url=${encodeURIComponent(data.download_url)}`;
            } else {
                alert(data.message);
            }
        } catch (error) {
            loader.style.display = 'none';
            alert('Bir hata oluştu, lütfen tekrar deneyin.');
        }
    }

    // TELEFONU GALERİYE KAYDETMEYE ZORLAYAN SİHRİBBAZ KOD
    async function downloadToGallery() {
        const btn = document.getElementById('greenDownloadBtn');
        const status = document.getElementById('statusText');
        
        if (!globalDownloadUrl) return;

        btn.style.pointerEvents = "none";
        btn.style.opacity = "0.6";
        status.style.display = "block";
        status.innerText = "Hazırlanıyor... Lütfen ekrandan ayrılmayın.";

        try {
            // Videoyu arka planda çekiyoruz
            const response = await fetch(globalDownloadUrl);
            const blob = await response.blob();
            
            // İŞİN SIRRI BURASI: Tarayıcıya bunun ham bir indirme değil, bir kamera/medya dosyası olduğunu söylüyoruz
            const galleryBlob = new Blob([blob], { type: 'video/quicktime' }); // iOS ve Android galerileri için evrensel format tetikleyici
            const blobUrl = window.URL.createObjectURL(galleryBlob);
            
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = blobUrl;
            
            // Rastgele isim vererek telefonun bunu yeni çekilmiş bir medya gibi algılamasını sağlıyoruz
            a.download = 'VID_' + Math.floor(Date.now() / 1000) + '.mp4';
            
            document.body.appendChild(a);
            a.click();
            
            window.URL.revokeObjectURL(blobUrl);
            document.body.removeChild(a);
            status.innerText = "Başarıyla İndirildi! Galeriyi kontrol edin.";
        } catch (error) {
            // Eğer tarayıcı çok çok eskiyse yedek olarak direkt linke yönlendir
            window.location.href = globalDownloadUrl;
            status.innerText = "İndirme başlatıldı.";
        } finally {
            setTimeout(() => {
                btn.style.pointerEvents = "auto";
                btn.style.opacity = "1";
                status.style.display = "none";
            }, 4000);
        }
    }
</script>

</body>
</html>
